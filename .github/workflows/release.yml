name: Publish signed ArcNet update

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'bridge: A10 для A7–A9; stable: версия из VERSION'
        type: choice
        options: [bridge, stable]
        default: bridge

permissions:
  contents: read

concurrency:
  group: arcnet-signed-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Inforberi/ArcNet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select immutable release ID
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          case "$RELEASE_TYPE" in
            bridge) version=0.7.0-stage5-a10;;
            stable) version=$(cat VERSION);;
            *) exit 64;;
          esac
          echo "ARCVPN_BUILD_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and verify without signing secrets
        run: ./scripts/build-installer-docker.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-build
          path: dist/installer-${{ env.ARCVPN_BUILD_VERSION }}/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: arcnet-release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.6'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-build
          path: dist/prebuilt
      - name: Bind publishing to the reviewed main snapshot
        run: |
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git checkout -B main "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Sign, verify, publish and advertise
        env:
          ARCVPN_SIGNING_KEY_HEX: ${{ secrets.ARCVPN_SIGNING_KEY_HEX }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          key="$RUNNER_TEMP/arcnet-signing.hex"
          trap 'rm -f "$key"' EXIT
          test -n "$ARCVPN_SIGNING_KEY_HEX" || { echo 'Missing environment signing secret'; exit 65; }
          printf '%s\n' "$ARCVPN_SIGNING_KEY_HEX" > "$key"
          unset ARCVPN_SIGNING_KEY_HEX
          args=(--publish --key "$key" --from-build dist/prebuilt)
          case "$RELEASE_TYPE" in bridge) args+=(--bridge);;stable) :;;*) exit 64;;esac
          ./scripts/release-update.sh "${args[@]}"
      - name: Preserve signed publication receipts for recovery
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-publication-receipts
          path: dist/release-*/
          if-no-files-found: ignore
          retention-days: 30
